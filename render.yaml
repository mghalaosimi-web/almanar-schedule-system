services:
  - type: web
    name: almanar-college-backend
    runtime: node
    plan: starter
    branch: main
    buildCommand: npm install && npm run build
    startCommand: node backend/src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEV_PORTAL_KEY
        value: "Manar@2026#GodMode!Dev"
