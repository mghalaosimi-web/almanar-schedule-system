name: manar_schedule
description: "تطبيق جداول كلية المنار الجامعية — Offline-First"
publish_to: 'none'
version: 2.1.0+3

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── Local Storage ──────────────────────────────
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # ── Network ────────────────────────────────────
  http: ^1.2.0
  dio: ^5.4.0
  connectivity_plus: ^6.0.3

  # ── Secure Storage ─────────────────────────────
  flutter_secure_storage: ^9.2.2

  # ── Fonts & Icons ──────────────────────────────
  google_fonts: ^6.1.0

  # ── UI / Animations ────────────────────────────
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  lottie: ^3.1.0

  # ── State Management ───────────────────────────
  provider: ^6.1.2

  # ── Navigation ─────────────────────────────────
  go_router: ^14.2.7

  # ── Utilities ──────────────────────────────────
  url_launcher: ^6.2.4
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.2.2
  google_sign_in: ^6.2.1

  # ── In-App APK Update (§18-20) ─────────────────────────────────
  path_provider: ^2.1.2
  open_file: ^3.3.2
  crypto: ^3.0.3
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#070B13"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
